name: Withdraw Contract Tests

on: [push, pull_request, merge_group, workflow_dispatch]

permissions:
  contents: read

jobs:
  settlement-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CC: clang
      CXX: clang++
      AR: llvm-ar
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev cmake pkg-config libssl-dev jq

      # The upgrade test signs a synthetic multisig digest with the real CLI.
      - name: Install ckb-cli 1.16.0
        shell: bash
        run: |
          archive="$RUNNER_TEMP/ckb-cli.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/nervosnetwork/ckb-cli/releases/download/v1.16.0/ckb-cli_v1.16.0_x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "9ceb9fc51905f7d9d902fc829bde2d059470b76fa95378a62ac8ec1e69ab53e6  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/withdraw-bin"
          install -m 755 "$RUNNER_TEMP/ckb-cli_v1.16.0_x86_64-unknown-linux-gnu/ckb-cli" "$RUNNER_TEMP/withdraw-bin/ckb-cli"
          "$RUNNER_TEMP/withdraw-bin/ckb-cli" --version
          echo "$RUNNER_TEMP/withdraw-bin" >> "$GITHUB_PATH"

      - name: Install refund Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 riscv64imac-unknown-none-elf

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            exit-withdraw/target/
            gwos/contracts/exit-withdraw-state-validator/target/
          key: ${{ runner.os }}-${{ runner.arch }}-withdraw-contracts-rust-1.95.0-${{ hashFiles('exit-withdraw/Cargo.lock', 'gwos/contracts/exit-withdraw-state-validator/Cargo.lock') }}

      - name: Contract unit and adversarial tests
        working-directory: gwos/contracts/exit-withdraw-state-validator
        run: cargo +1.95.0 test --locked --lib --tests

      - name: HTTP, RPC and offline host regressions
        working-directory: exit-withdraw
        run: cargo +1.95.0 test --locked

      # These scripts export synthetic profiles and build profile-pinned RISC-V
      # binaries before testing. They execute the contracts in CKB-VM, not just
      # the host verifier. Fixture binaries must never be deployed.
      - name: V1 settlement and EOA OmniLock withdrawal in CKB-VM
        run: bash exit-withdraw/scripts/test-settlement-e2e.sh

      - name: V0 settlement and EOA OmniLock withdrawal in CKB-VM
        run: bash exit-withdraw/scripts/test-v0-settlement-e2e.sh

      # Run after the EOA suites, which also fetch the dependencies needed by
      # this script's locked, offline host test commands.
      - name: V0 and V1 controller withdrawals in CKB-VM
        run: bash exit-withdraw/scripts/test-control-settlement-e2e.sh

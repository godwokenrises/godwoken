[package]
name = "exit-withdraw-state-validator"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
onchain = ["dep:ckb-std", "dep:sparse-merkle-tree"]
[dependencies]
sparse-merkle-tree = { version = "0.6.1", default-features = false, features = ["smtc"], optional = true }
gw-types = { path = "../../crates/types", default-features = false }
gw-common = { path = "../../crates/common", default-features = false }
gw-hash = { path = "../../crates/hash", default-features = false }
gw-smt = { path = "../../../crates/smt", default-features = false }
molecule = { version = "0.7.5", default-features = false }
ckb-std = { version = "0.16.4", optional = true, default-features = false, features = ["allocator", "ckb-types", "dummy-atomic"] }


[build-dependencies]
molecule-codegen = "0.7.5"

[dev-dependencies]
hex = "0.4"
serde_json = "1"

[profile.release]
opt-level = 3
# Native integer overflow aborts the transaction; U256 operators also reject overflow.
overflow-checks = true
panic = "abort"
codegen-units = 1

[[bin]]
name = "settlement-state-validator"
path = "src/settlement_main.rs"
required-features = ["onchain"]

[[bin]]
name = "v0-settlement-state-validator"
path = "src/v0_main.rs"
required-features = ["onchain"]
